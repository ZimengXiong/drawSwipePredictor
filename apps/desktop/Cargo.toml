[package]
name = "swipe-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "swipe-learned"

[[bin]]
name = "swipe-learned"
path = "src/bin/swipe-learned.rs"

[[bin]]
name = "swipe-memory"
path = "src/bin/swipe-memory.rs"

[[bin]]
name = "swipe-dtw"
path = "src/bin/swipe-dtw.rs"

[[bin]]
name = "swipe-ctc"
path = "src/bin/swipe-ctc.rs"
required-features = ["neural"]

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "jagged"
path = "src/bin/jagged.rs"

[features]
default = []
neural = ["swipe-engine/neural"]

[dependencies]
swipe-engine = { path = "../../crates/swipe-engine" }
macroquad = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
